services:
    traefik:
        image: traefik:3.6
        container_name: traefik
        command:
            - --providers.docker=true
            - --providers.docker.exposedbydefault=false
            - --entrypoints.http.address=:80
        ports:
            - "80:80"
        networks:
            - traefik-public
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
        labels:
            - traefik.enable=true
            - traefik.docker.network=traefik-public

    site-nginx:
        container_name: site-nginx
        build:
            context: .
            dockerfile: ./docker/nginx/Dockerfile
        networks:
            - traefik-public
            - default
        volumes:
            - ./:/app
        labels:
            - traefik.enable=true
            - traefik.docker.network=traefik-public
            - traefik.http.routers.site-nginx.rule=Host(`localhost`)
            - traefik.http.routers.site-nginx.entrypoints=http
            - traefik.http.services.site-nginx.loadbalancer.server.port=80

    site-php-fpm:
        container_name: site-php-fpm
        build:
            context: .
            dockerfile: ./docker/php/fpm/Dockerfile
        volumes:
            - ./:/app

    site-php-cli:
        container_name: site-php-cli
        build:
            context: .
            dockerfile: ./docker/php/cli/Dockerfile
        volumes:
            - ./:/app
        network_mode: service:site-nginx

    site-mysql:
        image: mysql:8.4
        container_name: site-mysql
        environment:
            MYSQL_DATABASE: "${MYSQL_DATABASE}"
            MYSQL_USER: "${MYSQL_USER}"
            MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
            MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
        ports:
            - "3306:3306"
        volumes:
            - site-mysql:/var/lib/mysql
            - ./database/setup.sql:/docker-entrypoint-initdb.d/setup.sql:ro

volumes:
    site-mysql:

networks:
    default:
    traefik-public:
        name: traefik-public
